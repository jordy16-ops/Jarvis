<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{--bg:#070b14;--ink:#eaf0ff;--muted:#8d9bb8;--a:#7c5cff;--b:#22d3ee;--ok:#34d399;--ko:#fb7185}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(1200px 800px at 50% 30%,#121a33,var(--bg));color:var(--ink);font:17px/1.45 Figtree,system-ui,sans-serif;overflow:hidden}
.w{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:18px 16px 22px;max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.heure{font:700 clamp(2.4rem,9vw,4.6rem)/1 Figtree,sans-serif;letter-spacing:-.02em}.date{color:var(--muted);text-transform:capitalize}
.piece{color:var(--muted);font-weight:600;text-align:right}.pc{font-size:.8rem}.pc.ko{color:var(--ko)}.pc.ok{color:var(--ok)}
.centre{display:grid;place-items:center;align-content:center;gap:18px;text-align:center}
.orbe{width:min(46vw,250px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 40%),conic-gradient(from 0deg,var(--a),var(--b),#f472b6,var(--a));filter:blur(.3px) saturate(1.2);box-shadow:0 0 80px #7c5cff66,inset 0 0 40px #0006;animation:tourne 12s linear infinite;transition:transform .3s,box-shadow .3s}
.orbe.ecoute{transform:scale(1.08);box-shadow:0 0 120px #22d3eeaa,inset 0 0 40px #0006}.orbe.pense{animation-duration:2.5s}.orbe.parle{animation-duration:5s;box-shadow:0 0 140px #f472b6aa,inset 0 0 40px #0006}
@keyframes tourne{to{rotate:360deg}}@media (prefers-reduced-motion:reduce){.orbe{animation:none}}
.etat{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--b)}.entendu{color:var(--muted);min-height:1.4em;max-width:40ch}.rep{font-size:clamp(1.05rem,3.2vw,1.35rem);max-width:44ch;min-height:2.8em}
.bas{display:grid;gap:10px}.row{display:flex;gap:8px}input{flex:1;min-width:0;font:inherit;padding:13px 14px;border-radius:14px;border:1px solid #ffffff26;background:#ffffff0f;color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px 16px;border-radius:14px;border:0;background:#ffffff1a;color:var(--ink);cursor:pointer}.pri{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.parler{width:100%;padding:22px;font-size:1.2rem}.petit{color:var(--muted);font-size:.85rem;text-align:center}
.voile{position:fixed;inset:0;background:#070b14f2;display:grid;place-items:center;text-align:center;padding:24px;z-index:5}.voile div{max-width:34ch;display:grid;gap:14px}
.qui{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.qui button{padding:8px 12px;font-size:.9rem}.qui button.on{background:var(--a)}
</style></head><body><main class="w">
<div class="top"><div><div class="heure" id="heure">--:--</div><div class="date" id="date"></div></div><div class="piece"><div id="nomP"></div><div class="pc" id="pc">…</div></div></div>
<div class="centre"><div class="orbe" id="orbe" aria-hidden="true"></div><div class="etat" id="etat">Prêt</div><div class="entendu" id="ent"></div><div class="rep" id="rep" aria-live="polite"></div></div>
<div class="bas"><button class="pri parler" id="parler" type="button" hidden>🎙 Appuyer pour parler</button>
<form class="row" id="f" autocomplete="off"><input id="txt" placeholder="…ou écris (le micro du clavier marche aussi)" aria-label="Ta demande pour Jarvis"><button class="pri" type="submit">Envoyer</button></form>
<div class="qui" id="qui"><span class="petit">Qui parle ?</span></div><p class="petit" id="aide"></p></div>
</main>
<div class="voile" id="voile"><div><b style="font-size:1.4rem">🎙 Jarvis dans la pièce</b><span id="voileTxt">Touche le bouton pour autoriser le micro et le son.</span><button class="pri" id="go" type="button">Démarrer</button></div></div>
<script>
